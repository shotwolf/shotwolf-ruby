name: Publish to RubyGems

# Publishes on any pushed tag like v0.1.0. Set a RubyGems API key as the repo
# secret RUBYGEMS_API_KEY (or switch to trusted publishing / OIDC).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Test
        run: ruby -Ilib -Itest test/client_test.rb

      - name: Verify tag matches gem version
        run: |
          VER=$(ruby -Ilib -e "require 'shotwolf/version'; print Shotwolf::VERSION")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VER" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Shotwolf::VERSION $VER" >&2
            exit 1
          fi

      - name: Build & push
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build shotwolf.gemspec
          gem push shotwolf-*.gem
